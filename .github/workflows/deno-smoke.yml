name: Deno Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deno-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno-smoke:
    name: Deno Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      # libxmljs2 is an optional peer dep installed locally for our own XSD
      # tests. Its native binding segfaults Deno; real consumers of the
      # library on Deno won't install it, so drop it here to faithfully
      # simulate that scenario.
      - name: Remove libxmljs2 (Deno-incompatible native binding)
        # Hoisted to the workspace root node_modules; also clear any nested
        # copy in case hoisting changes.
        run: rm -rf node_modules/libxmljs2 packages/ksef-client-ts/node_modules/libxmljs2

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno smoke test
        # deno.json (with the `smoke` task) lives in the package, not the
        # workspace root.
        working-directory: packages/ksef-client-ts
        run: deno task smoke

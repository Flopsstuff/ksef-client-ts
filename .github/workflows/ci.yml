name: Tests (Unit + E2E)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint docs
        run: yarn lint:md

  unit:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Run tests with coverage
        run: yarn test --coverage

      - name: Coverage summary
        if: matrix.node-version == 22 && success()
        run: |
          node -e "
          const r = require('./coverage/coverage-summary.json').total;
          const fmt = (m) => m.pct + '%';
          const lines = [
            '## Coverage Summary',
            '',
            '| Metric | Coverage |',
            '|--------|----------|',
            '| Statements | ' + fmt(r.statements) + ' |',
            '| Branches | ' + fmt(r.branches) + ' |',
            '| Functions | ' + fmt(r.functions) + ' |',
            '| Lines | ' + fmt(r.lines) + ' |',
          ];
          require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          "

      - name: Update coverage badge
        if: matrix.node-version == 22 && github.ref == 'refs/heads/main' && success()
        run: |
          COVERAGE=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct)")
          COLOR=$([[ $(echo "$COVERAGE >= 80" | bc) == 1 ]] && echo "brightgreen" || ([[ $(echo "$COVERAGE >= 60" | bc) == 1 ]] && echo "yellow" || echo "red"))
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GIST_SECRET }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/gists/${{ secrets.GIST_ID }} \
            -d "{\"files\":{\"ksef-client-ts-coverage.json\":{\"content\":\"{\\\"schemaVersion\\\":1,\\\"label\\\":\\\"coverage\\\",\\\"message\\\":\\\"${COVERAGE}%\\\",\\\"color\\\":\\\"${COLOR}\\\"}\"}}}"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Run E2E tests
        run: yarn test:e2e

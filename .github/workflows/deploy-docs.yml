name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "packages/ksef-client-ts/docs/**"
      - "packages/ksef-client-ts/CHANGELOG.md"
      - "packages/ksef-client-ts/README.md"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Without this, setup-node prefers the runner image's cached 22.x,
          # which lags the security releases this pin exists to pick up.
          check-latest: true

      # Node 25+ no longer bundles Corepack, so install it before enabling.
      - name: Enable Corepack
        run: |
          npm install -g corepack@0.36.0
          corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build docs
        run: yarn docs:build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/ksef-client-ts/docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

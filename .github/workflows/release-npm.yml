name: "Release: npm"

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Needed for OpenID Connect (OIDC)
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate build
        run: yarn lint && yarn test && yarn build

      - name: Publish package
        # No NODE_AUTH_TOKEN needed — auth via OIDC (id-token: write)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view ksef-client-ts@"$VERSION" version 2>/dev/null; then
            echo "Version $VERSION already published to npm, skipping"
            exit 0
          fi
          npm publish --access public --provenance

name: Agent Trigger

# The `agent-run` label on an issue sends it to the Paperclip routine (#56).
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to send to the Paperclip routine
        required: true
        type: number
      dry_run:
        description: Build and print the payload without sending it
        required: false
        type: boolean
        default: false

concurrency:
  group: agent-trigger-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  fire:
    name: Fire Paperclip routine
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent-run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
      ACTOR: ${{ github.actor }}
      EVENT_NAME: ${{ github.event_name }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      SERVER_URL: ${{ github.server_url }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      # An empty or missing AGENT_TRIGGER_USERS allows nobody.
      - name: Check that the actor is on the allow-list
        env:
          ALLOWED_USERS: ${{ vars.AGENT_TRIGGER_USERS }}
        run: |
          set -f
          allowed=false
          for user in ${ALLOWED_USERS//,/ }; do
            if [ "${user,,}" = "${ACTOR,,}" ]; then
              allowed=true
            fi
          done
          if [ "$allowed" != true ]; then
            echo "::error::$ACTOR is not on the AGENT_TRIGGER_USERS allow-list."
            exit 1
          fi
          echo "$ACTOR is allowed to trigger agents."

      # Paperclip exposes only top-level keys to the routine, so keys stay flat.
      - name: Build the payload
        run: |
          gh api "repos/$REPO/issues/$ISSUE_NUMBER" > issue.json
          if jq -e 'has("pull_request")' issue.json > /dev/null; then
            echo "::error::#$ISSUE_NUMBER is a pull request, not an issue."
            exit 1
          fi
          gh api "repos/$REPO" > repo.json
          if ! gh api "repos/$REPO/issues/$ISSUE_NUMBER/parent" > parent.json 2> /dev/null; then
            echo '{}' > parent.json
          fi
          jq -n \
            --slurpfile issue issue.json \
            --slurpfile repo repo.json \
            --slurpfile parent parent.json \
            --arg repository "$REPO" \
            --arg actor "$ACTOR" \
            --arg trigger "$EVENT_NAME" \
            --arg delivery "$REPO#$ISSUE_NUMBER@$RUN_ID" \
            --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" \
            --arg run_url "$SERVER_URL/$REPO/actions/runs/$RUN_ID" \
            --arg triggered_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '($issue[0]) as $i | ($repo[0]) as $r | ($parent[0]) as $p | {
              source: "github",
              event: "agent-run",
              deliveryId: $delivery,
              trigger: $trigger,
              repository: $repository,
              triggeredBy: $actor,
              triggered_at: $triggered_at,
              repository_url: $r.html_url,
              repository_clone_url: $r.clone_url,
              repository_default_branch: $r.default_branch,
              issue_number: $i.number,
              issue_url: $i.html_url,
              issue_api_url: $i.url,
              issue_title: $i.title,
              issue_state: $i.state,
              issue_author: $i.user.login,
              issue_labels: ([$i.labels[].name] | join(", ")),
              issue_assignees: ([$i.assignees[].login] | join(", ")),
              issue_milestone: ($i.milestone.title // ""),
              issue_comments: $i.comments,
              issue_created_at: $i.created_at,
              issue_updated_at: $i.updated_at,
              parent_issue_number: ($p.number // ""),
              parent_issue_url: ($p.html_url // ""),
              run_id: $run_id,
              run_attempt: $run_attempt,
              run_url: $run_url
            }' > payload.json
          echo "Payload:"
          jq . payload.json

      - name: Fire the routine
        if: env.DRY_RUN != 'true'
        env:
          PAPERCLIP_WEBHOOK_URL: ${{ secrets.PAPERCLIP_WEBHOOK_URL }}
          PAPERCLIP_WEBHOOK_SECRET: ${{ secrets.PAPERCLIP_WEBHOOK_SECRET }}
        run: |
          if [ -z "$PAPERCLIP_WEBHOOK_URL" ] || [ -z "$PAPERCLIP_WEBHOOK_SECRET" ]; then
            echo "::error::PAPERCLIP_WEBHOOK_URL or PAPERCLIP_WEBHOOK_SECRET is not set."
            exit 1
          fi
          status=$(curl -sS -o response.txt -w '%{http_code}' --max-time 30 \
            -X POST "$PAPERCLIP_WEBHOOK_URL" \
            -H "Authorization: Bearer $PAPERCLIP_WEBHOOK_SECRET" \
            -H "Idempotency-Key: $REPO#$ISSUE_NUMBER@$RUN_ID" \
            -H 'Content-Type: application/json' \
            --data-binary @payload.json)
          echo "Paperclip answered HTTP $status"
          case "$status" in
            2*)
              ;;
            *)
              echo "::error::The routine webhook rejected the event (HTTP $status)."
              exit 1
              ;;
          esac

      # Never fails the run: the routine has started, a red run would invite a re-run.
      - name: Mark the issue as queued
        if: env.DRY_RUN != 'true'
        run: |
          if ! gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
            --add-label agent-queued --remove-label agent-run; then
            echo "::warning::The routine was started, but the labels on #$ISSUE_NUMBER could not be updated. Do not re-run this job."
          fi

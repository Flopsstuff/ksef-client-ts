name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="release_notes.md"
          CHANGELOG="packages/ksef-client-ts/CHANGELOG.md"

          if [[ ! -f "$CHANGELOG" ]]; then
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {in_section=1; next}
            in_section && $0 ~ "^## \\[" {exit}
            in_section {print}
          ' "$CHANGELOG" > "$NOTES_FILE"

          if [[ -s "$NOTES_FILE" ]] && [[ -n "$(tr -d '[:space:]' < "$NOTES_FILE")" ]]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_NOTES: ${{ steps.changelog.outputs.has_notes }}
        run: |
          if gh release view "$GITHUB_REF_NAME" &>/dev/null; then
            echo "Release $GITHUB_REF_NAME already exists, skipping"
            exit 0
          fi
          if [[ "$HAS_NOTES" == "true" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release_notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

  publish-npm:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./packages/ksef-client-ts/package.json').version")"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate build
        run: yarn lint && yarn test && yarn build

      - name: Publish package
        working-directory: packages/ksef-client-ts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view ksef-client-ts@"$VERSION" version 2>/dev/null; then
            echo "Version $VERSION already published to npm, skipping"
            exit 0
          fi
          npm publish --access public --provenance

  publish-ghpkg:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@flopsstuff"

      - name: Enable Corepack
        run: corepack enable

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./packages/ksef-client-ts/package.json').version")"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate build
        run: yarn lint && yarn test && yarn build

      - name: Prepare scoped package name
        working-directory: packages/ksef-client-ts
        run: npm pkg set name="@flopsstuff/ksef-client-ts"

      - name: Publish
        working-directory: packages/ksef-client-ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@flopsstuff/ksef-client-ts@$VERSION" version --registry https://npm.pkg.github.com 2>/dev/null; then
            echo "Version $VERSION already published to GitHub Packages, skipping"
            exit 0
          fi
          npm publish --registry https://npm.pkg.github.com

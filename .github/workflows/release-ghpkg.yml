name: "Release: GitHub Packages"

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@flopsstuff"

      - name: Enable Corepack
        run: corepack enable

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate build
        run: yarn lint && yarn test && yarn build

      - name: Prepare scoped package name
        # npm (not yarn) used here: need to temporarily override package name
        # to @flopsstuff/ksef-client-ts for GitHub Packages scoped registry
        run: npm pkg set name="@flopsstuff/ksef-client-ts"

      - name: Publish
        # npm publish used directly — yarn npm publish doesn't support
        # --registry override needed for GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@flopsstuff/ksef-client-ts@$VERSION" version --registry https://npm.pkg.github.com 2>/dev/null; then
            echo "Version $VERSION already published to GitHub Packages, skipping"
            exit 0
          fi
          npm publish --registry https://npm.pkg.github.com
